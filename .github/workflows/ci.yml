name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install released public harness contract
        run: python -m pip install .
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Deploy skills to isolated Codex home
        run: python scripts/bootstrap.py --apply
      - name: Run doctor gate
        run: python scripts/doctor.py --cross-tool --diff
