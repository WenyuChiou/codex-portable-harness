name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Deploy skills to isolated Codex home
        run: python scripts/bootstrap.py --apply
      - name: Run doctor gate
        run: python scripts/doctor.py --cross-tool --diff
